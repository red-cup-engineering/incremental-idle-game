name: Receive world designs through the playable build
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: idle-design-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  receive-design:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install the locked suppliers
        run: npm ci --ignore-scripts --no-audit --no-fund --maxsockets=1
      - name: Refuse design and generated-source drift
        run: npm run check:generated
      - name: Receive design edits through actual game transitions and build
        run: npm test
      - name: Produce the static artifact and its source receipt
        run: npm run build
